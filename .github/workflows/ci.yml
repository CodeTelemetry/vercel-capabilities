name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      TURBO_FORCE: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run adversarial and fixture tests
        run: npm test

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 2 --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan complete Git history
        run: |
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks-default.toml"
          touch "$RUNNER_TEMP/empty-gitleaksignore"
          "$RUNNER_TEMP/gitleaks" git . \
            --config "$RUNNER_TEMP/gitleaks-default.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/empty-gitleaksignore" \
            --log-opts='--all --full-history' \
            --ignore-gitleaks-allow --redact --no-banner --timeout 120
